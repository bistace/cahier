[package]
name = "cahier"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
crossterm = "0.27"
ctrlc = "3.5.1"
dirs = "6.0.0"
libc = "0.2"
nix = { version = "0.30.1", features = ["signal", "process", "poll"] }
nu-ansi-term = "0.49.0"
portable-pty = "0.8"
reedline = "0.26"
ratatui = "0.29"
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
strip-ansi-escapes = "0.2"
syntect = "5.3.0"
textwrap = "0.16"
